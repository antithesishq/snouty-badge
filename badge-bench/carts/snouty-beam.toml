# snouty-beam: send carts badge to badge (carts/snouty-beam/PLAN.md). No
# cable here (the link is faked as unplugged), so the cart searches and
# pumps the link until 14 ms into every frame by design: `busy ms` reads
# ~14. The drive image below holds five UF2s (fragmented, 7 clusters at a
# time): the first frames analyse one per frame (the worst frames), then
# Down x3 and A ("PLUG IN THE CABLE"; with no partner nothing is greyed
# but invalid UF2s, since an M3 partner takes XIP carts as files).
# Build the image with
#   python3 tools/make_romfs.py out/beam-romfs.img zig-out/firmware/snouty-pong.uf2 \
#     zig-out/firmware/snouty-beam.uf2 zig-out/firmware/snouty-boy.uf2 \
#     zig-out/firmware/demosnout.uf2 zig-out/firmware/snouty-lynx-xip.uf2 --fragment 7
budget_ms = 16.7
frames = 300
press = ["DOWN:60-62", "DOWN:80-82", "DOWN:100-102", "DOWN:120-122", "A:140-142", "UP:180-182", "A:200-202"]
romfs = "out/beam-romfs.img"
