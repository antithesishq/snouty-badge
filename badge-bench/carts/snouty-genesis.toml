# snouty-genesis: Genesis emulator, XIP cart only (SPEC.md section 13), two
# Genesis frames per update presented at 30 Hz (60/30, SPEC.md section 8):
# budget 33.3 ms per update. M0: the stubbed core draws the test pattern.
#
# Not picked by ELF name (the XIP ELF is snouty-genesis-xip.elf, whose
# basename has the -xip suffix); from the repository root:
#   zig build -Dcart=snouty-genesis -Dcart-mode=xip
#   python3 tools/make_romfs.py carts/snouty-genesis/out/romfs.img
#   badge-bench/bench.sh zig-out/firmware/snouty-genesis-xip.elf \
#       --config badge-bench/carts/snouty-genesis.toml --symbols
# The default build reads the badge drive, so the run needs an image: the
# one above is an empty volume (no ROM file), so the cart falls back to its
# embedded ROM, which is what this benchmark measures. To bench a ROM from
# the drive instead, add it to the image (`ROM.bin=NAME.GEN`) or pass
# --romfs.
budget_ms = 33.3
frames = 120
# No input: the M0 core ignores the pad; M1 swaps in a script for the
# shipped test ROM (tools/scripts/m1_play.json).
romfs = "carts/snouty-genesis/out/romfs.img"
