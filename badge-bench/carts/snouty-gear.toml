# snouty-gear: Game Gear emulator, 60 fps. M3: the boot splash (72 frames,
# what the badge shows first), then the emulated console playing Waternet
# from the drive image below (the badge build embeds no ROM) while the
# time scrubber records (a keyframe every 30 game frames), then two menu
# passes that scrub.
budget_ms = 16.7
frames = 1000
# Same sequence as carts/snouty-gear/tools/scripts/m3_scrub.json: M2's
# m2_play game sequence (Start through the title and menu, d-pad cursor
# moves and button 1 (badge B) to turn tiles, one button 2 (badge A) press),
# then Select held from 673 so the menu opens on game frame 630 (a keyframe),
# Left x3 (back 1.5 s), Right, Up (panel back), B to resume from -1.0 s
# (drops the future), 102 game frames (the second Select hold included),
# the menu again on frame 672, Left (back to 660), B.
press = ["START:162-167", "START:222-227", "B:282-287", "RIGHT:312-319",
         "B:332-335", "DOWN:352-359", "B:372-375", "LEFT:392-399",
         "B:412-415", "B:432-435", "UP:452-459", "B:472-475",
         "RIGHT:492-499", "RIGHT:512-519", "B:532-535", "DOWN:552-559",
         "A:572-575", "B:592-595", "LEFT:612-619", "B:632-635", "UP:652-659",
         "SELECT:673-708", "LEFT:712-713", "LEFT:723-724", "LEFT:734-735",
         "RIGHT:745-746", "UP:751-752", "B:757-758", "SELECT:830-865",
         "LEFT:876-877", "B:890-891"]
