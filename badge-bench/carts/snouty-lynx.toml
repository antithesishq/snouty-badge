# snouty-lynx: Atari Lynx emulator, 60 fps. The real core (65C02, Mikey
# timers and interrupts, Suzy sprites and math, the boot without the boot
# ROM) running roms/raycast.lnx (42Bastian's textured raycaster,
# Apache-2.0) from the drive fixture: the Iris-mark splash (skipped by A on
# update 40), then raycast's walls and HUD with the status strip (M2: title,
# ROM name and origin; the debug overlay is off at boot), and from update
# 314 the emulator menu over the frozen frame with the time scrubber (M3).
# M1 perf pass (2026-10-01): busy mean 8.44 ms, p95 11.53, worst 12.96,
# 0 of 300 over (was 16.69 / 22.23 / 24.29, 255 over; PLAN.md Status).
# M2 (2026-10-01, m2_play.json): game frames 0-299 busy mean 8.42, p95
# 11.50, worst 12.94; menu frames 334-364 mean 0.92, worst 1.17; 0 of 400 over.
budget_ms = 16.7
frames = 480
# carts/snouty-lynx/tools/scripts/m3_scrub.json: A skips the splash at 40,
# then m1_play.json's moves through the maze (Up 70-130, Left 131-160,
# Up+Right 161-210, Down 211-240, Up+B 241-280); Select held 285-320 (the
# menu opens at 314); Left held 330-375 (scrub back at 330, 345, 360, 375:
# the press and three 4/s repeats); Right at 390 and 400 (forward twice);
# B at 415 resumes from the scrubbed position; Up 420-450, Right 451-479.
script = "carts/snouty-lynx/tools/scripts/m3_scrub.json"
# The committed drive fixture carts/snouty-lynx/tests/fixtures/m1_drive.img
# (RAYCAST.LNX = roms/raycast.lnx; regenerate with
# carts/snouty-lynx/tests/fixtures/make_fixtures.py) so the bench runs the
# drive path the badge uses. Without a romfs the bench maps no drive and the
# romfs scan faults at start-up (the badge reads blank flash there instead).
# For a local run with a real dump (never committed):
#   python3 tools/make_romfs.py out/lynx-romfs.img ~/roms/lynx/hard_drivin.lnx
#   badge-bench/bench.sh zig-out/firmware/snouty-lynx.elf --romfs out/lynx-romfs.img
romfs = "carts/snouty-lynx/tests/fixtures/m1_drive.img"
