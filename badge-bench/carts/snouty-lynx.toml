# snouty-lynx: Atari Lynx emulator, 60 fps. M1: the real core (65C02, Mikey
# timers and interrupts, Suzy sprites and math, the boot without the boot
# ROM) running the embedded roms/raycast.lnx (42Bastian's textured
# raycaster, Apache-2.0): the Iris-mark splash (skipped by A on update 40),
# then raycast's walls and HUD with the status strip (debug numbers on in
# M1: fps, mean/worst step us, instructions and Suzy pixels per frame).
budget_ms = 16.7
frames = 300
# carts/snouty-lynx/tools/scripts/m1_play.json: A skips the splash at 40,
# Up 70-130, Left 131-160, Up+Right 161-210, Down 211-240, Right 241-270,
# Up+B 271-299 (moves and turns through the maze).
script = "carts/snouty-lynx/tools/scripts/m1_play.json"
# The committed drive fixture carts/snouty-lynx/tests/fixtures/m1_drive.img
# (RAYCAST.LNX = roms/raycast.lnx; regenerate with
# carts/snouty-lynx/tests/fixtures/make_fixtures.py) so the bench runs the
# drive path the badge uses. Without a romfs the bench maps no drive and the
# romfs scan faults at start-up (the badge reads blank flash there instead).
# For a local run with a real dump (never committed):
#   python3 tools/make_romfs.py out/lynx-romfs.img ~/roms/lynx/hard_drivin.lnx
#   badge-bench/bench.sh zig-out/firmware/snouty-lynx.elf --romfs out/lynx-romfs.img
romfs = "carts/snouty-lynx/tests/fixtures/m1_drive.img"
